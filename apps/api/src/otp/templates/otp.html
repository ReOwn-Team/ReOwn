<!doctype html>
<html lang="vi" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light" />
        <title>{{title}} · ReOwn</title>
        <style>
            @media screen and (max-width: 480px) {
                .email-content {
                    padding: 32px 24px !important;
                }
                .email-title {
                    font-size: 24px !important;
                    line-height: 32px !important;
                }
                .email-code {
                    font-size: 38px !important;
                    letter-spacing: 7px !important;
                }
            }
        </style>
    </head>
    <body
        style="
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #222222;
            font-family: Arial, Helvetica, sans-serif;
            -webkit-text-size-adjust: 100%;
        "
    >
        <div
            style="
                display: none;
                font-size: 1px;
                line-height: 1px;
                max-height: 0;
                max-width: 0;
                opacity: 0;
                overflow: hidden;
                mso-hide: all;
            "
        >
            Mã {{action}} có hiệu lực trong 5 phút.
        </div>
        <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            bgcolor="#ffffff"
        >
            <tr>
                <td align="center">
                    <!--[if mso]><table role="presentation" width="560" cellpadding="0" cellspacing="0"><tr><td><![endif]-->
                    <table
                        role="presentation"
                        width="100%"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                        style="max-width: 560px"
                    >
                        <tr>
                            <td
                                class="email-content"
                                style="padding: 48px 32px"
                            >
                                <img
                                    src="cid:reown-logo"
                                    alt="ReOwn"
                                    width="144"
                                    height="48"
                                    border="0"
                                    style="
                                        display: block;
                                        width: 144px;
                                        height: 48px;
                                        border: 0;
                                        color: #222222;
                                        font-size: 18px;
                                    "
                                />
                                <h1
                                    class="email-title"
                                    style="
                                        margin: 40px 0 16px;
                                        font-size: 26px;
                                        line-height: 34px;
                                        font-weight: 700;
                                        color: #222222;
                                    "
                                >
                                    {{title}}
                                </h1>
                                <p
                                    style="
                                        margin: 0;
                                        font-size: 16px;
                                        line-height: 26px;
                                        color: #444444;
                                    "
                                >
                                    {{description}}
                                </p>
                                <p
                                    class="email-code"
                                    dir="ltr"
                                    style="
                                        margin: 28px 0;
                                        font-family:
                                            Consolas, &quot;Courier New&quot;,
                                            monospace;
                                        font-size: 40px;
                                        line-height: 52px;
                                        letter-spacing: 8px;
                                        font-weight: 700;
                                        color: #222222;
                                    "
                                >
                                    {{code}}
                                </p>
                                <p
                                    style="
                                        margin: 0 0 32px;
                                        font-size: 15px;
                                        line-height: 25px;
                                        color: #444444;
                                    "
                                >
                                    Mã có hiệu lực trong
                                    <strong>5 phút</strong> và chỉ dùng một
                                    lần.<br />Không chia sẻ mã này với bất kỳ
                                    ai.
                                </p>
                                <p
                                    style="
                                        margin: 0;
                                        padding-top: 24px;
                                        border-top: 1px solid #e8e8e8;
                                        font-size: 13px;
                                        line-height: 22px;
                                        color: #737373;
                                    "
                                >
                                    Nếu bạn không yêu cầu {{action}}, hãy bỏ qua
                                    email này.
                                </p>
                                <p
                                    style="
                                        margin: 20px 0 0;
                                        font-size: 13px;
                                        line-height: 22px;
                                        color: #737373;
                                    "
                                >
                                    ReOwn<br />Đồ cũ, giá trị mới.
                                </p>
                            </td>
                        </tr>
                    </table>
                    <!--[if mso]></td></tr></table><![endif]-->
                </td>
            </tr>
        </table>
    </body>
</html>
