version: 2

updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      groups:
          shared:
              patterns:
                  - "*"
              update-types:
                  - minor
                  - patch

    - package-ecosystem: npm
      directory: /apps/web
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      groups:
          web:
              patterns:
                  - "*"
              update-types:
                  - minor
                  - patch

    - package-ecosystem: npm
      directory: /apps/api
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      groups:
          api:
              patterns:
                  - "*"
              update-types:
                  - minor
                  - patch

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      groups:
          actions:
              patterns:
                  - "*"
              update-types:
                  - minor
                  - patch
