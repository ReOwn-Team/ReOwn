name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        env:
            NEXT_TELEMETRY_DISABLED: "1"
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      apps/web/package-lock.json
            - name: Cài thư viện shared
              working-directory: .
              run: npm ci
            - name: Cài thư viện web
              working-directory: apps/web
              run: npm ci
            - name: Unit test shared
              working-directory: .
              run: npm test
            - name: Lint web
              working-directory: apps/web
              run: npm run lint
            - name: Typecheck web
              working-directory: apps/web
              run: npm run typecheck
            - name: Build Next.js
              working-directory: .
              run: npm run build
            - name: Cài Chromium cho Playwright
              working-directory: apps/web
              run: npx playwright install --with-deps chromium
            - name: Smoke test trình duyệt
              working-directory: .
              run: npm run e2e
            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: playwright-report
                  path: |
                      apps/web/playwright-report
                      apps/web/test-results
                  retention-days: 7
