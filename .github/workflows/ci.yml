name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: package-lock.json
            - name: Cài thư viện
              run: npm ci
            - name: Unit test (engine, tìm kiếm, bản demo)
              run: npm test
            - name: Build
              run: npm run build
            - name: Build standalone demo
              run: npm run build:single
            - name: Cài Chromium cho Playwright
              run: npx playwright install --with-deps chromium
            - name: Test trình duyệt (bản demo)
              run: npm run e2e
            - uses: actions/upload-artifact@v6
              if: failure()
              with:
                  name: playwright-report
                  path: |
                      playwright-report
                      test-results
                  retention-days: 7
