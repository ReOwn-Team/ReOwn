<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ReOwn</title>
    <script>
      try { var t = JSON.parse(localStorage.getItem('reown-theme') || 'null'); if (t) { var r = document.documentElement; if (t.mode === 'light' || t.mode === 'dark') r.dataset.theme = t.mode; if (t.accent && t.accent !== 'blue') r.dataset.accent = t.accent; } } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
