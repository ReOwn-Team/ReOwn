<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eef1f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1118" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="ReOwn — chợ đồ cũ cho sinh viên: tiền giữ hộ đến khi nhận hàng, trả sau 3–6 kỳ, người bán được chấm điểm uy tín." />
    <title>ReOwn — Chợ đồ cũ cho sinh viên</title>
    <script>
      try { var t = JSON.parse(localStorage.getItem('reown-theme') || 'null'); if (t) { var r = document.documentElement; if (t.mode === 'light' || t.mode === 'dark') r.dataset.theme = t.mode; if (t.accent && t.accent !== 'green') r.dataset.accent = t.accent; } } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
